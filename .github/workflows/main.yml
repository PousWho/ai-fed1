name: Dev ai_federation Frontend workflow

on:
  push:
    branches:
      - main

jobs:
  build_front_and_push_to_docker_hub:
    name: Push frontend Docker image to DockerHub
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.FRONTEND_IMAGE_NAME }}:latest

  build_nginx_and_push_to_docker_hub:
    name: Push nginx Docker image to DockerHub
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./infra/nginx/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.FRONTEND_NGINX_IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_front_and_push_to_docker_hub
      - build_nginx_and_push_to_docker_hub
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3
    - name: Copy docker-compose.production.yml via ssh
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST_DEV }}
        username: ${{ secrets.USER_DEV }}
        key: ${{ secrets.SSH_KEY }}
        source: "infra/docker-compose.production.yml"
        target: "ai_federation"
        strip_components: 1
        debug: true
    - name: Executing remote ssh commands to deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_DEV }}
        username: ${{ secrets.USER_DEV }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd
          cd ai_federation
          echo '${{ secrets.SUDO_PASSWORD_DEV }}' | sudo -S docker compose -f docker-compose.production.yml pull
          echo '${{ secrets.SUDO_PASSWORD_DEV }}' | sudo -S docker compose -f docker-compose.production.yml down
          echo '${{ secrets.SUDO_PASSWORD_DEV }}' | sudo -S docker compose -f docker-compose.production.yml up -d
          echo '${{ secrets.SUDO_PASSWORD_DEV }}' | sudo -S docker image prune -f
#          echo '${{ secrets.SUDO_PASSWORD_DEV }}' | sudo -S docker container prune -f
#          echo '${{ secrets.SUDO_PASSWORD_DEV }}' | sudo -S docker builder prune -f

  send_message:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Send message
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: Деплой ai_federation успешно выполнен!