services:
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        CONTACT_API_ORIGIN: http://backend:4000
    container_name: fii_frontend
    restart: unless-stopped
    env_file: ../.env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    expose:
      - "3000"
    depends_on:
      - backend

  backend:
    build:
      context: ../backend
    container_name: fii_backend
    restart: unless-stopped
    env_file: ../backend/.env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    expose:
      - "4000"

  caddy:
    image: caddy:2-alpine
    container_name: fii_caddy
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
